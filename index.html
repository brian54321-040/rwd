<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧通勤資訊平台</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="container">
            <h1>智慧通勤資訊平台</h1>
            <p>Smart Commute Information</p>
        </div>
    </header>

    <main class="container">

        <!-- 最新消息 -->
        <section class="section">
            <h2>最新消息</h2>

            <div class="news-list">

                <article class="news-card">
                    <span class="news-icon">🌧️</span>
                    <div>
                        <h3>降雨提醒</h3>
                        <p>今日降雨機率較高，外出通勤請記得攜帶雨具。</p>
                    </div>
                </article>

                <article class="news-card">
                    <span class="news-icon">☀️</span>
                    <div>
                        <h3>高溫提醒</h3>
                        <p>氣溫較高，外出時請注意防曬並適時補充水分。</p>
                    </div>
                </article>

                <article class="news-card">
                    <span class="news-icon">😷</span>
                    <div>
                        <h3>空氣品質提醒</h3>
                        <p>請留意當日空氣品質，必要時建議配戴口罩。</p>
                    </div>
                </article>

            </div>
        </section>


        <!-- 未來資料分析 -->
        <section class="section">

            <h2>通勤資料分析</h2>

            <div class="chart-card">

                <div class="chart-placeholder">
                    <div class="chart-icon">📊</div>
                    <h3>通勤資料圖表</h3>
                    <p>未來可串接 MySQL 資料庫，顯示歷史天氣、降雨機率及 AQI 等資料。</p>

                    <div class="fake-chart">
                        <div class="bar bar-1"></div>
                        <div class="bar bar-2"></div>
                        <div class="bar bar-3"></div>
                        <div class="bar bar-4"></div>
                        <div class="bar bar-5"></div>
                    </div>
                </div>

            </div>

        </section>

    </main>


    <footer>
        <p>Smart Commute Information Platform</p>
    </footer>
<script src="script.js"></script>
</body>
</html>
